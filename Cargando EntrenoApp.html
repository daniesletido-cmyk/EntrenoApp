<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>EntrenoApp</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1120; overflow: hidden; font-family: system-ui, sans-serif; }
  .card {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: #f1f5f9;
    background: linear-gradient(135deg, #0b1120, #17264a, #7c3a12);
    background-size: 220% 220%;
    animation: move 7s ease-in-out infinite;
  }
  @keyframes move { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

  .logo-wrap {
    width: 112px; height: 112px;
    opacity: 0;
    transform: scale(0.6) translateY(10px);
    animation: pop 0.7s cubic-bezier(.34,1.56,.64,1) 0.15s forwards;
  }
  .logo-wrap img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 8px 22px rgba(0,0,0,0.4)); }
  @keyframes pop { to { opacity: 1; transform: scale(1) translateY(0); } }

  .title { font-weight: 700; font-size: 22px; letter-spacing: 0.3px; opacity: 0; animation: fadeUp 0.5s ease-out 0.5s forwards; }
  .status { font-size: 14px; opacity: 0; color: #cbd5e1; animation: fadeUp 0.5s ease-out 0.75s forwards; text-align: center; max-width: 380px; padding: 0 20px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .bar { width: 200px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.15); overflow: hidden; opacity: 0; animation: fadeUp 0.5s ease-out 0.9s forwards; }
  .bar-fill { height: 100%; width: 40%; border-radius: 999px; background: linear-gradient(90deg, #3b82f6, #f97316); animation: run 1.3s ease-in-out infinite; }
  @keyframes run { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

  .manual { margin-top: 14px; font-size: 14px; opacity: 0; animation: fadeUp 0.5s ease-out 1.1s forwards; text-align: center; }
  .manual a {
    display: inline-block;
    background: #3b82f6;
    color: #ffffff;
    text-decoration: none;
    padding: 8px 18px;
    border-radius: 8px;
    font-weight: 600;
    margin-top: 6px;
    transition: background 0.2s;
  }
  .manual a:hover { background: #2563eb; }
</style>
</head>

    <div class="title">EntrenoApp</div>
    <div class="status" id="status">Arrancando el servidor local, un momento…</div>
    <div class="bar"><div class="bar-fill"></div></div>
    <div class="manual" id="manual" style="display:none">
      <p style="margin:0 0 6px 0; color:#cbd5e1;">El servidor ya debería estar listo:</p>
      <a href="http://localhost:3210" id="manualLink">Entrar a EntrenoApp &rarr;</a>
    </div>
  </div>
  <script>
    const APP_URL = "http://localhost:3210";
    const phrases = [
      "Arrancando el servidor local, un momento…",
      "Preparando tu plan de entrenamiento…",
      "Cargando tus datos…",
      "Ya casi está…",
    ];
    let i = 0;
    const statusEl = document.getElementById("status");
    setInterval(() => {
      i = (i + 1) % phrases.length;
      statusEl.textContent = phrases[i];
    }, 1800);

    let attempts = 0;
    let redirected = false;

    function go() {
      if (redirected) return;
      redirected = true;
      window.location.href = APP_URL;
    }

    function checkServer() {
      attempts++;
      if (attempts >= 4) {
        document.getElementById("manual").style.display = "block";
      }

      // 1. Probar fetch estándar
      fetch(APP_URL, { mode: "no-cors", cache: "no-store" })
        .then(() => go())
        .catch(() => {
          // 2. Fallback de sonda por imagen (por si CORS/PNA bloquea fetch)
          const probe = new Image();
          probe.onload = probe.onerror = () => go();
          probe.src = APP_URL + "/favicon.ico?t=" + Date.now();
          setTimeout(checkServer, 700);
        });
    }

    // Tras 6 segundos, auto-redirigir si aún no ha entrado
    setTimeout(() => {
      document.getElementById("manual").style.display = "block";
    }, 3000);

    checkServer();
  </script>
