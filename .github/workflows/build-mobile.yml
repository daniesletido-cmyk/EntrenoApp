name: Compilar Apps Moviles (Android e iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Compilar APK (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Compilar frontend y sincronizar Capacitor
        run: npm run build:mobile

      - name: Dar permisos de ejecucion a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: EntrenoApp-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: Compilar IPA / Proyecto (iOS)
    runs-on: macos-14
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Compilar frontend y sincronizar Capacitor
        run: npm run build:mobile

      - name: Compilar App de iOS con Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Empaquetar Payload .app en .ipa
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r EntrenoApp-iOS-Debug.ipa Payload
          rm -rf Payload

      - name: Subir IPA como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: EntrenoApp-iOS-Debug-IPA
          path: EntrenoApp-iOS-Debug.ipa
          if-no-files-found: warn
